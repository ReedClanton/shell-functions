name: Style Guide Check of shellName()
run-name: ${{ github.actor }} triggered style guide check of shellName() for the ${{ github.run_attempt }} time by initiating a ${{ github.event_name }}
on:
  push:
    paths:
      - util/shellName/shellName.sh
      - .github/workflows/style-guide-shellName*
      - .github/actions/**/*
  workflow_dispatch:
jobs:
  style-guide-util-shellName:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v3
      - name: Install Style Guide Checking Tool...
        uses: ./.github/actions/install-shfmt-on-linux
      - name: Run style guide check...
        run:  shfmt --diff --case-indent --posix ./util/shellName/shellName.sh

