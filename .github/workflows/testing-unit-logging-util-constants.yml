name: Unit Test logging()'s constants
run-name: ${{ github.actor }} has triggered the running of unit tests of logging()'s constants file for the ${{ github.run_attempt }} time by initiating a ${{ github.event_name }}
on: [push, workflow_dispatch]
jobs:
  unit-test-ubuntu-bash-logging-util-constants:
    runs-on: ubuntu-latest
    steps:
      - name: Checking out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v3
      - name: Install 'Kcov' (test coverage tool) and 'shellspec' (POSIX shell script testing tool)...
        uses: ./.github/actions/install-kcov-and-shellspec
      - name: Running unit tests from a 'bash' shell (with code coverage) from ${{ github.workspace }}...
        run:  shellspec --no-fail-fast -p -s /bin/bash --kcov --kcov-options "--include-pattern=logging/util/constants.sh --limits=99,100" ./spec/unit/logging/util/constants_*
        # TODO #53: Pipeline doesn't process --fail-low-coverage correctly.
##        run:  $HOME/.local/bin/shellspec --no-fail-fast -p -s /bin/bash --kcov --kcov-options "--include-pattern=logging/util/constants.sh --limits=99,100" --fail-low-coverage ./spec/unit/logging/util/constants_*
  unit-test-ubuntu-dash-logging-util-constants:
    runs-on: ubuntu-latest
    steps:
      - name: Checking out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v3
      - name: Installing 'shellspec' (POSIX shell script testing tool)...
        uses: ./.github/actions/install-shellspec
      - name: Running unit tests from a 'dash' shell...
        run:  shellspec --no-fail-fast -s /bin/dash ./spec/unit/logging/util/constants_*
  unit-test-ubuntu-zsh-logging-util-constants:
    runs-on: ubuntu-latest
    steps:
      - name: Checking out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v3
      - name: Installing 'shellspec' (POSIX shell script testing tool)...
        uses: ./.github/actions/install-shellspec
      - name: Installing 'zsh' (shell)...
        uses: ./.github/actions/install-zsh-shell-via-apt
      - name: Running unit tests from a 'zsh' shell...
        run:  shellspec --no-fail-fast -s /usr/bin/zsh ./spec/unit/logging/util/constants_*
  unit-test-ubuntu-ksh-logging-util-constants:
    runs-on: ubuntu-latest
    steps:
      - name: Checking out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v3
      - name: Installing 'shellspec' (POSIX shell script testing tool)...
        uses: ./.github/actions/install-shellspec
      - name: Installing 'ksh' (shell)...
        uses: ./.github/actions/install-ksh-shell-via-apt-get
      - name: Running unit tests from a 'ksh' shell...
        run:  shellspec --no-fail-fast -s /usr/bin/ksh ./spec/unit/logging/util/constants_*
  unit-test-macos-bash-logging-util-constants:
    runs-on: macos-12
    steps:
      - name: Checking out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v3
      - name: Installing 'shellspec' (POSIX shell script testing tool)...
        uses: ./.github/actions/install-shellspec
      - name: Running unit tests from a 'bash' shell (with code coverage) from ${{ github.workspace }}...
        run:  $HOME/.local/bin/shellspec --no-fail-fast -s /bin/bash ./spec/unit/logging/util/constants_*
  unit-test-macos-dash-logging-util-constants:
    runs-on: macos-12
    steps:
      - name: Checking out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v3
      - name: Installing 'shellspec' (POSIX shell script testing tool)...
        uses: ./.github/actions/install-shellspec
      - name: Running unit tests from a 'dash' shell...
        run:  $HOME/.local/bin/shellspec --no-fail-fast -s /bin/dash ./spec/unit/logging/util/constants_*
  unit-test-macos-zsh-logging-util-constants:
    runs-on: macos-12
    steps:
      - name: Checking out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v3
      - name: Installing 'shellspec' (POSIX shell script testing tool)...
        uses: ./.github/actions/install-shellspec
      - name: Running unit tests from a 'zsh' shell...
        run:  $HOME/.local/bin/shellspec -s /bin/zsh --no-fail-fast ./spec/unit/logging/util/constants_*

