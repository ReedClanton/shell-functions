name: Test output()'s Constants on Legacy Shell(s)
run-name: ${{ github.actor }} triggered testing of output()'s constants.sh on legacy shell(s) for the ${{ github.run_attempt }} time by initiating a ${{ github.event_name }}.
on:
  # Run by ci.yml, which decides when this is needed.
  workflow_call:
    outputs:
      # Code coverage and functional tests are gated by successful zsh unit tests.
      zsh-result:
        description: Result of the zsh test job ('success', 'failure' or 'cancelled').
        value: ${{ jobs.test-output-util-constants-zsh-legacy-ubuntu.outputs.result }}
  # Lets this workflow still be run on its own from the Actions tab.
  workflow_dispatch:
jobs:
  test-output-util-constants-bash-legacy-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v4
      - name: Install ShellSpec...
        uses: ./.github/actions/install-shellspec
      - name: Install bash 3.2 (shell)...
        id:   shell
        uses: ./.github/actions/install-bash-via-source
        with:
          version:  '3.2'
      - name: Run test(s) on bash...
        id:   tests
        uses: ./.github/actions/run-shellspec
        with:
          test-path:  ./spec/unit/output/util/constants_*
          shell:      ${{ steps.shell.outputs.path }}
      - name: Record result for badge...
        if:   ${{ !cancelled() }}
        uses: ./.github/actions/record-badge-result
        with:
          badge:    output/util/constants-bash_legacy.json
          label:    "bash ${{ steps.shell.outputs.version }}"
          status:   ${{ job.status }}
          skipped:  ${{ steps.tests.outputs.skipped }}
  test-output-util-constants-dash-legacy-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v4
      - name: Install ShellSpec...
        uses: ./.github/actions/install-shellspec
      - name: Install dash 0.5.13.1 (shell)...
        id:   shell
        uses: ./.github/actions/install-dash-via-source
        with:
          version:  '0.5.13.1'
      - name: Run test(s) on dash...
        id:   tests
        uses: ./.github/actions/run-shellspec
        with:
          test-path:  ./spec/unit/output/util/constants_*
          shell:      ${{ steps.shell.outputs.path }}
      - name: Record result for badge...
        if:   ${{ !cancelled() }}
        uses: ./.github/actions/record-badge-result
        with:
          badge:    output/util/constants-dash_legacy.json
          label:    "dash ${{ steps.shell.outputs.version }}"
          status:   ${{ job.status }}
          skipped:  ${{ steps.tests.outputs.skipped }}
  test-output-util-constants-zsh-legacy-ubuntu:
    runs-on: ubuntu-latest
    # Test result.
    outputs:
      result: ${{ steps.result.outputs.result }}
    steps:
      - name: Check out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v4
      - name: Install ShellSpec...
        uses: ./.github/actions/install-shellspec
      - name: Install zsh 5.0.1 (shell)...
        id:   shell
        uses: ./.github/actions/install-zsh-via-source
        with:
          version: '5.0.1'
      - name: Run test(s) on zsh...
        id:   tests
        uses: ./.github/actions/run-shellspec
        with:
          test-path:  ./spec/unit/output/util/constants_*
          shell:      ${{ steps.shell.outputs.path }}
      - name: Record result for badge...
        if:   ${{ !cancelled() }}
        uses: ./.github/actions/record-badge-result
        with:
          badge:    output/util/constants-zsh_legacy.json
          label:    "zsh ${{ steps.shell.outputs.version }}"
          status:   ${{ job.status }}
          skipped:  ${{ steps.tests.outputs.skipped }}
      - name:   Record result for workflow(s) gated by unit test success...
        id:     result
        if:     ${{ !cancelled() }}
        shell:  sh
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "result=$JOB_STATUS" >> "$GITHUB_OUTPUT"
