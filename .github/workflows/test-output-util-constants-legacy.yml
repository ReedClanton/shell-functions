name: Test output()'s Constants File on Legacy Shell(s)
run-name: ${{ github.actor }} triggered testing of output()'s constants.sh on legacy shell(s) for the ${{ github.run_attempt }} time by initiating a ${{ github.event_name }}.
on:
  push:
    # Run this when these are touched.
    paths:
      # CUT.
      - output/util/constants.sh
      # CUT test(s).
      - spec/unit/output/util/constants_*
      # This or related workflows.
      - .github/workflows/test-output*
      # All action(s), regardless of if used.
      - .github/actions/**/*
  workflow_dispatch:
jobs:
  test-output-util-constants-bash-legacy-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v3
      - name: Install ShellSpec...
        uses: ./.github/actions/install-shellspec
      - name: Install bash 3.2 (shell)...
        id:   shell
        uses: ./.github/actions/install-bash-via-source
        with:
          version:  3.2
      - name: Run test(s) on bash...
        id:   tests
        uses: ./.github/actions/run-shellspec
        with:
          test-path:  ./spec/unit/output/util/constants_*
          shell:      ${{ steps.shell.outputs.path }}
      - name: Record result for badge...
        if:   ${{ !cancelled() }}
        uses: ./.github/actions/record-badge-result
        with:
          badge:    output/util/constants-bash-legacy.json
          label:    "constants.sh: bash ${{ steps.shell.outputs.version }}"
          status:   ${{ job.status }}
          skipped:  ${{ steps.tests.outputs.skipped }}
  test-output-util-constants-dash-legacy-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checking out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v3
      - name: Install ShellSpec...
        uses: ./.github/actions/install-shellspec
      - name: Install dash (shell)...
        id:   shell
        uses: ./.github/actions/install-dash-via-source
        with:
          shell: dash
      - name: Run test(s) on dash...
        id:   tests
        uses: ./.github/actions/run-shellspec
        with:
          test-path:  ./spec/unit/output/util/constants_*
          shell:      ${{ steps.shell.outputs.path }}
      - name: Record result for badge...
        if:   ${{ !cancelled() }}
        uses: ./.github/actions/record-badge-result
        with:
          badge:    output/util/constants-dash-legacy.json
          label:    "constants.sh: dash ${{ steps.shell.outputs.version }}"
          status:   ${{ job.status }}
          skipped:  ${{ steps.tests.outputs.skipped }}
  #test-output-util-constants-zsh-legacy-ubuntu:
  #  runs-on: ubuntu-latest
  #  steps:
  #    - name: Checking out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
  #      uses: actions/checkout@v3
  #    - name: Install ShellSpec...
  #      uses: ./.github/actions/install-shellspec
  #    - name: Install zsh (shell)...
  #      id:   shell
  #      uses: ./.github/actions/install-zsh-via-source
  #      with:
  #        shell: zsh
  #    - name: Run test(s) on zsh...
  #      id:   tests
  #      uses: ./.github/actions/run-shellspec
  #      with:
  #        test-path:  ./spec/unit/output/util/constants_*
  #        shell:      ${{ steps.shell.outputs.path }}
  #    - name: Record result for badge...
  #      if:   ${{ !cancelled() }}
  #      uses: ./.github/actions/record-badge-result
  #      with:
  #        badge:    output/util/constants-zsh-legacy.json
  #        label:    "constants.sh: zsh ${{ steps.shell.outputs.version }}"
  #        status:   ${{ job.status }}
  #        skipped:  ${{ steps.tests.outputs.skipped }}
  publish-badges:
    needs:
      - test-output-util-constants-bash-legacy-ubuntu
      - test-output-util-constants-dash-legacy-ubuntu
  #    - test-output-util-constants-zsh-legacy-ubuntu
    # Run whether the tests passed or failed, but not if the run was
    # cancelled, so a cancelled run doesn't overwrite the last real result.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Needed so the local publish-badges action is available.
      - uses: actions/checkout@v3
      - uses: ./.github/actions/publish-badges
