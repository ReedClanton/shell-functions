name: Test verifyInputProvided()
run-name: ${{ github.actor }} triggered testing of verifyInputProvided() for the ${{ github.run_attempt }} time by initiating a ${{ github.event_name }}.
on:
  # Run by ci.yml, which decides when this is needed.
  workflow_call:
  # Lets this workflow still be run on its own from the Actions tab.
  workflow_dispatch:
jobs:
  test-util-verifyInputProvided-busybox-ash-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v4
      - name: Install ShellSpec...
        uses: ./.github/actions/install-shellspec
      - name: Install BusyBox ash (shell)...
        id:   shell
        uses: ./.github/actions/install-shell-via-nixpkgs
        with:
          shell:    ash
          package:  busybox
      - name: Run test(s) on ash...
        id:   tests
        uses: ./.github/actions/run-shellspec
        with:
          test-path:  ./spec/unit/util/verifyInputProvided/verifyInputProvided_*
          shell:      ${{ steps.shell.outputs.path }}
      - name: Record result for badge...
        if:   ${{ !cancelled() }}
        uses: ./.github/actions/record-badge-result
        with:
          badge:    util/verifyInputProvided/verifyInputProvided-ash.json
          label:    "ash"
          status:   ${{ job.status }}
          skipped:  ${{ steps.tests.outputs.skipped }}
  test-util-verifyInputProvided-bash-macos:
    runs-on: macos-latest
    steps:
      - name: Check out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v4
      - name: Install ShellSpec...
        uses: ./.github/actions/install-shellspec
      - name: Install bash (shell)...
        id:   shell
        uses: ./.github/actions/install-shell-via-homebrew
        with:
          shell: bash
      - name: Run test(s) on bash...
        uses: ./.github/actions/run-shellspec
        with:
          test-path:  ./spec/unit/util/verifyInputProvided/verifyInputProvided_*
          shell:      ${{ steps.shell.outputs.path }}
  test-util-verifyInputProvided-dash-macos:
    runs-on: macos-latest
    steps:
      - name: Check out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v4
      - name: Install ShellSpec...
        uses: ./.github/actions/install-shellspec
      - name: Install dash (shell)...
        id:   shell
        uses: ./.github/actions/install-shell-via-homebrew
        with:
          shell: dash
      - name: Run test(s) on dash...
        uses: ./.github/actions/run-shellspec
        with:
          test-path:  ./spec/unit/util/verifyInputProvided/verifyInputProvided_*
          shell:      ${{ steps.shell.outputs.path }}
  test-util-verifyInputProvided-zsh-macos:
    runs-on: macos-latest
    steps:
      - name: Check out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v4
      - name: Install ShellSpec...
        uses: ./.github/actions/install-shellspec
      - name: Install zsh (shell)...
        id:   shell
        uses: ./.github/actions/install-shell-via-homebrew
        with:
          shell: zsh
      - name: Run test(s) on zsh...
        uses: ./.github/actions/run-shellspec
        with:
          test-path:  ./spec/unit/util/verifyInputProvided/verifyInputProvided_*
          shell:      ${{ steps.shell.outputs.path }}
