          shell: dash
      # TODO: Sort out they `github.workspace` is blank.
      - name: Running tests of verifyInputProvided() from a 'dash' shell, with out code coverage, from ${{ github.workspace }}...
        uses: ./.github/actions/run-shellspec
        with:
          test-path:    ./spec/unit/util/verifyInputProvided/verifyInputProvided_*
          shell:        ${{ steps.dash.outputs.path }}
  unit-test-verifyInputProvided-zsh-macos:
    runs-on: macos-latest
    steps:
      - name: Checking out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v3
      - name: Installing ShellSpec...
        uses: ./.github/actions/install-shellspec
      - name: Installing zsh (shell)
        id:   zsh
