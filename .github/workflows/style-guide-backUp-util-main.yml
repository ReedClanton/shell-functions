name: Style Guide Check of backUp.sh's Main File
run-name: ${{ github.actor }} triggered style guide check of backUp.sh's main.sh file for the ${{ github.run_attempt }} time by initiating a ${{ github.event_name }}
on:
  push:
    paths:
      - backUp/util/main.sh
      - .github/workflows/style-guide-backUp*
      - .github/actions/**/*
  workflow_dispatch:
jobs:
  style-guide-backUp-util-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v4
      - name: Install Style Guide Checking Tool...
        uses: ./.github/actions/install-shfmt-on-linux
      - name: Run style guide check...
        run:  shfmt --diff --case-indent --posix ./backUp/util/main.sh

