name: Test logging()'s Constants
run-name: ${{ github.actor }} triggered testing of logging()'s constants.sh for the ${{ github.run_attempt }} time by initiating a ${{ github.event_name }}.
on:
  push:
    # Run this when these are touched.
    paths:
      # CUT.
      - logging/util/constants.sh
      # CUT test(s).
      - spec/unit/logging/util/constants_*
      # Test configuration.
      - spec/spec_helper.sh
      - .shellspec
      - spec/support/bin/*
      # Badge configuration.
      - .github/badge-dependencies
      # This or related workflows.
      - .github/workflows/test-logging*
      # All action(s), regardless of if used.
      - .github/actions/**/*
  workflow_dispatch:
jobs:
  test-logging-util-constants-bash-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v4
      - name: Install ShellSpec...
        uses: ./.github/actions/install-shellspec
      - name: Install bash (shell)...
        id:   shell
        uses: ./.github/actions/install-shell-via-nixpkgs
        with:
          shell: bash
      - name: Run test(s) on bash...
        uses: ./.github/actions/run-shellspec
        with:
          test-path:  ./spec/unit/logging/util/constants_*
          shell:      ${{ steps.shell.outputs.path }}
  test-logging-util-constants-dash-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v4
      - name: Install ShellSpec...
        uses: ./.github/actions/install-shellspec
      - name: Install dash (shell)...
        id:   shell
        uses: ./.github/actions/install-shell-via-nixpkgs
        with:
          shell: dash
      - name: Run test(s) on dash...
        uses: ./.github/actions/run-shellspec
        with:
          test-path:  ./spec/unit/logging/util/constants_*
          shell:      ${{ steps.shell.outputs.path }}
  test-logging-util-constants-zsh-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v4
      - name: Install ShellSpec...
        uses: ./.github/actions/install-shellspec
      - name: Install zsh (shell)...
        id:   shell
        uses: ./.github/actions/install-shell-via-nixpkgs
        with:
          shell: zsh
      - name: Run test(s) on zsh...
        uses: ./.github/actions/run-shellspec
        with:
          test-path:  ./spec/unit/logging/util/constants_*
          shell:      ${{ steps.shell.outputs.path }}
  test-logging-util-constants-bash-macos:
    runs-on: macos-latest
    steps:
      - name: Check out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v4
      - name: Install ShellSpec...
        uses: ./.github/actions/install-shellspec
      - name: Install bash (shell)...
        id:   shell
        uses: ./.github/actions/install-shell-via-homebrew
        with:
          shell: bash
      - name: Run test(s) on bash...
        uses: ./.github/actions/run-shellspec
        with:
          test-path:  ./spec/unit/logging/util/constants_*
          shell:      ${{ steps.shell.outputs.path }}
  test-logging-util-constants-dash-macos:
    runs-on: macos-latest
    steps:
      - name: Check out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v4
      - name: Install ShellSpec...
        uses: ./.github/actions/install-shellspec
      - name: Install dash (shell)...
        id:   shell
        uses: ./.github/actions/install-shell-via-homebrew
        with:
          shell: dash
      - name: Run test(s) on dash...
        uses: ./.github/actions/run-shellspec
        with:
          test-path:  ./spec/unit/logging/util/constants_*
          shell:      ${{ steps.shell.outputs.path }}
  test-logging-util-constants-zsh-macos:
