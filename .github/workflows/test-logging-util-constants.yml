        uses: actions/checkout@v3
      - name: Installing ShellSpec...
        uses: ./.github/actions/install-shellspec
      - name: Installing bash (shell)
        id:   bash
        uses: ./.github/actions/install-shell-via-homebrew
        with:
          shell: bash
      # TODO: Sort out they `github.workspace` is blank.
