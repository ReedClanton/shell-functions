name: Test logging()'s constants
run-name: ${{ github.actor }} triggered testing of logging()'s constants without code coverage for the ${{ github.run_attempt }} time by initiating a ${{ github.event_name }}.
on: [push, workflow_dispatch]
jobs:
  unit-test-logging-util-constants-bash-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checking out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v3
      - name: Installing ShellSpec
        uses: ./.github/actions/install-shellspec
      - name: Install bash (shell)
        id:   bash
        uses: ./.github/actions/install-shell-via-apt
        with:
          shell: bash
      # TODO: Sort out they `github.workspace` is blank.
      - name: Running tests of logging()'s constants from a 'bash' shell on ${{ github.workspace }}...
        uses: ./.github/actions/run-shellspec
        with:
          test-path:    ./spec/unit/logging/util/constants_*
          shell:        ${{ steps.bash.outputs.path }}
  unit-test-logging-util-constants-dash-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checking out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v3
      - name: Installing ShellSpec
        uses: ./.github/actions/install-shellspec
      - name: Install dash (shell)
        id:   dash
        uses: ./.github/actions/install-shell-via-apt
        with:
          shell: dash
      # TODO: Sort out they `github.workspace` is blank.
      - name: Running tests of logging()'s constants from a 'dash' shell on ${{ github.workspace }}...
        uses: ./.github/actions/run-shellspec
        with:
          test-path:    ./spec/unit/logging/util/constants_*
          shell:        ${{ steps.dash.outputs.path }}
  unit-test-logging-util-constants-zsh-ubuntu:
