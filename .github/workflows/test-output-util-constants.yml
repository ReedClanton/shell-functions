name: Test output()'s Constants File
run-name: ${{ github.actor }} triggered testing of output()'s constants.sh for the ${{ github.run_attempt }} time by initiating a ${{ github.event_name }}.
on:
  push:
    # Run this when these are touched.
    paths:
      # CUT.
      - output/util/constants.sh
      # CUT test(s).
      - spec/unit/output/util/constants_*
      # This or related workflows.
      - .github/workflows/test-output*
      # All action(s), regardless of if used.
      - .github/actions/**/*
  workflow_dispatch:
jobs:
  test-output-util-constants-bash-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checking out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v3
      - name: Install ShellSpec...
        uses: ./.github/actions/install-shellspec
      - name: Install bash (shell)...
        id:   bash
        uses: ./.github/actions/install-shell-via-nixpkgs
        with:
          shell: bash
      - name: Run test(s) on bash...
        id:   tests
        uses: ./.github/actions/run-shellspec
        with:
          test-path:  ./spec/unit/output/util/constants_*
          shell:      ${{ steps.bash.outputs.path }}
      - name: Record result for badge...
        if:   ${{ !cancelled() }}
        uses: ./.github/actions/record-badge-result
        with:
          badge:    output/util/constants-bash.json
          label:    "constants.sh: bash"
          status:   ${{ job.status }}
          skipped:  ${{ steps.tests.outputs.skipped }}
  test-output-util-constants-busybox-ash-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checking out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v3
      - name: Install ShellSpec...
        uses: ./.github/actions/install-shellspec
      - name: Install BusyBox ash (shell)...
        id:   ash
        uses: ./.github/actions/install-shell-via-nixpkgs
        with:
          shell:    ash
          package:  busybox
      - name: Run test(s) on ash...
        id:   tests
        uses: ./.github/actions/run-shellspec
        with:
          test-path:  ./spec/unit/output/util/constants_*
          shell:      ${{ steps.ash.outputs.path }}
      - name: Record result for badge...
        if:   ${{ !cancelled() }}
        uses: ./.github/actions/record-badge-result
        with:
          badge:    output/util/constants-ash.json
          label:    "constants.sh: ash"
          status:   ${{ job.status }}
          skipped:  ${{ steps.tests.outputs.skipped }}
  test-output-util-constants-dash-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checking out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v3
      - name: Install ShellSpec...
        uses: ./.github/actions/install-shellspec
      - name: Install dash (shell)...
        id:   dash
        uses: ./.github/actions/install-shell-via-nixpkgs
        with:
          shell: dash
      - name: Run test(s) on dash...
        id:   tests
        uses: ./.github/actions/run-shellspec
        with:
          test-path:  ./spec/unit/output/util/constants_*
          shell:      ${{ steps.dash.outputs.path }}
      - name: Record result for badge...
        if:   ${{ !cancelled() }}
        uses: ./.github/actions/record-badge-result
        with:
          badge:    output/util/constants-dash.json
          label:    "constants.sh: dash"
          status:   ${{ job.status }}
          skipped:  ${{ steps.tests.outputs.skipped }}
  test-output-util-constants-zsh-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checking out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v3
      - name: Install ShellSpec...
        uses: ./.github/actions/install-shellspec
      - name: Install zsh (shell)...
        id:   zsh
        uses: ./.github/actions/install-shell-via-nixpkgs
        with:
          shell: zsh
      - name: Run test(s) on zsh...
        id:   tests
        uses: ./.github/actions/run-shellspec
        with:
          test-path:  ./spec/unit/output/util/constants_*
          shell:      ${{ steps.zsh.outputs.path }}
      - name: Record result for badge...
        if:   ${{ !cancelled() }}
        uses: ./.github/actions/record-badge-result
        with:
          badge:    output/util/constants-zsh.json
          label:    "constants.sh: zsh"
          status:   ${{ job.status }}
          skipped:  ${{ steps.tests.outputs.skipped }}
  test-output-util-constants-bash-macos:
    runs-on: macos-latest
    steps:
      - name: Checking out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v3
      - name: Install ShellSpec...
        uses: ./.github/actions/install-shellspec
      - name: Install bash (shell)...
        id:   bash
        uses: ./.github/actions/install-shell-via-homebrew
        with:
          shell: bash
      - name: Run test(s) on bash...
        uses: ./.github/actions/run-shellspec
        with:
          test-path:  ./spec/unit/output/util/constants_*
          shell:      ${{ steps.bash.outputs.path }}
  test-output-util-constants-dash-macos:
    runs-on: macos-latest
    steps:
      - name: Checking out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v3
      - name: Install ShellSpec...
        uses: ./.github/actions/install-shellspec
      - name: Install dash (shell)...
        id:   dash
        uses: ./.github/actions/install-shell-via-homebrew
        with:
          shell: dash
      - name: Run test(s) on dash...
        uses: ./.github/actions/run-shellspec
        with:
          test-path:  ./spec/unit/output/util/constants_*
          shell:      ${{ steps.dash.outputs.path }}
  test-output-util-constants-zsh-macos:
    runs-on: macos-latest
    steps:
      - name: Checking out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v3
      - name: Install ShellSpec...
        uses: ./.github/actions/install-shellspec
      - name: Install zsh (shell)...
        id:   zsh
        uses: ./.github/actions/install-shell-via-homebrew
        with:
          shell: zsh
      - name: Run test(s) on zsh...
        uses: ./.github/actions/run-shellspec
        with:
          test-path:  ./spec/unit/output/util/constants_*
          shell:      ${{ steps.zsh.outputs.path }}
  publish-badges:
    needs:
      - test-output-util-constants-bash-ubuntu
      - test-output-util-constants-busybox-ash-ubuntu
      - test-output-util-constants-dash-ubuntu
      - test-output-util-constants-zsh-ubuntu
    # Run whether the tests passed or failed, but not if the run was
    # cancelled, so a cancelled run doesn't overwrite the last real result.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Needed so the local publish-badges action is available.
      - uses: actions/checkout@v3
      - uses: ./.github/actions/publish-badges
