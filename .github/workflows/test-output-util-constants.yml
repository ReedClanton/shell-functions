name: Test output()'s constants
run-name: ${{ github.actor }} triggered testing of output()'s constants without code coverage for the ${{ github.run_attempt }} time by initiating a ${{ github.event_name }}.
on:
  push:
    paths:
      - output/util/constants.sh
      - .github/workflows/**
      - .github/actions/**
  workflow_dispatch:
jobs:
  unit-test-output-util-constants-bash-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checking out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v3
      - name: Installing ShellSpec
        uses: ./.github/actions/install-shellspec
      - name: Install bash (shell)
        id:   bash
        uses: ./.github/actions/install-shell-via-apt
        with:
          shell: bash
      # TODO: Sort out they `github.workspace` is blank.
      - name: Running tests of output()'s constants from a 'bash' shell on ${{ github.workspace }}...
        id:   tests
        uses: ./.github/actions/run-shellspec
        with:
          test-path:    ./spec/unit/output/util/constants_*
          shell:        ${{ steps.bash.outputs.path }}
      - name: Recording bash result for badge...
        if:   ${{ !cancelled() }}
        uses: ./.github/actions/record-badge-result
        with:
          badge:   output/util/constants-bash.json
          label:   "constants.sh: bash"
          status:  ${{ job.status }}
          skipped: ${{ steps.tests.outputs.skipped }}
  unit-test-output-util-constants-dash-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checking out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v3
      - name: Installing ShellSpec
        uses: ./.github/actions/install-shellspec
      - name: Install dash (shell)
        id:   dash
        uses: ./.github/actions/install-shell-via-apt
        with:
          shell: dash
      # TODO: Sort out they `github.workspace` is blank.
      - name: Running tests of output()'s constants from a 'dash' shell on ${{ github.workspace }}...
        id:   tests
        uses: ./.github/actions/run-shellspec
        with:
          test-path:    ./spec/unit/output/util/constants_*
          shell:        ${{ steps.dash.outputs.path }}
      - name: Recording dash result for badge...
        if:   ${{ !cancelled() }}
        uses: ./.github/actions/record-badge-result
        with:
          badge:   output/util/constants-dash.json
          label:   "constants.sh: dash"
          status:  ${{ job.status }}
          skipped: ${{ steps.tests.outputs.skipped }}
  unit-test-output-util-constants-zsh-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checking out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v3
      - name: Installing ShellSpec
        uses: ./.github/actions/install-shellspec
      - name: Install zsh (shell)
        id:   zsh
        uses: ./.github/actions/install-shell-via-apt
        with:
          shell: zsh
      # TODO: Sort out they `github.workspace` is blank.
      - name: Running tests of output()'s constants from a 'zsh' shell on ${{ github.workspace }}...
        id:   tests
        uses: ./.github/actions/run-shellspec
        with:
          test-path:    ./spec/unit/output/util/constants_*
          shell:        ${{ steps.zsh.outputs.path }}
      - name: Recording zsh result for badge...
        if:   ${{ !cancelled() }}
        uses: ./.github/actions/record-badge-result
        with:
          badge:   output/util/constants-zsh.json
          label:   "constants.sh: zsh"
          status:  ${{ job.status }}
          skipped: ${{ steps.tests.outputs.skipped }}
  unit-test-output-util-constants-bash-macos:
    runs-on: macos-latest
    steps:
      - name: Checking out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v3
      - name: Installing ShellSpec...
        uses: ./.github/actions/install-shellspec
      - name: Installing bash (shell)
        id:   bash
        uses: ./.github/actions/install-shell-via-homebrew
        with:
          shell: bash
      # TODO: Sort out they `github.workspace` is blank.
      - name: Running tests of output()'s constants from a 'bash' shell, with out code coverage, from ${{ github.workspace }}...
        uses: ./.github/actions/run-shellspec
        with:
          test-path:    ./spec/unit/output/util/constants_*
          shell:        ${{ steps.bash.outputs.path }}
  unit-test-output-util-constants-dash-macos:
    runs-on: macos-latest
    steps:
      - name: Checking out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v3
      - name: Installing ShellSpec...
        uses: ./.github/actions/install-shellspec
      - name: Installing dash (shell)
        id:   dash
        uses: ./.github/actions/install-shell-via-homebrew
        with:
          shell: dash
      # TODO: Sort out they `github.workspace` is blank.
      - name: Running tests of output()'s constants from a 'dash' shell, with out code coverage, from ${{ github.workspace }}...
        uses: ./.github/actions/run-shellspec
        with:
          test-path:    ./spec/unit/output/util/constants_*
          shell:        ${{ steps.dash.outputs.path }}
  unit-test-output-util-constants-zsh-macos:
    runs-on: macos-latest
    steps:
      - name: Checking out ${{ github.ref_type }} ${{ github.ref_name }} from ${{ github.repository_owner }}'s ${{ github.repository }} repo on ${{ runner.os }} because ${{ github.actor }} initiated a ${{ github.event_name }}...
        uses: actions/checkout@v3
      - name: Installing ShellSpec...
        uses: ./.github/actions/install-shellspec
      - name: Installing zsh (shell)
        id:   zsh
        uses: ./.github/actions/install-shell-via-homebrew
        with:
          shell: zsh
      # TODO: Sort out they `github.workspace` is blank.
      - name: Running tests of output()'s constants from a 'zsh' shell, with out code coverage, from ${{ github.workspace }}...
        uses: ./.github/actions/run-shellspec
        with:
          test-path:    ./spec/unit/output/util/constants_*
          shell:        ${{ steps.zsh.outputs.path }}
  publish-badges:
    needs:
      - unit-test-output-util-constants-bash-ubuntu
      - unit-test-output-util-constants-dash-ubuntu
      - unit-test-output-util-constants-zsh-ubuntu
    # Run whether the tests passed or failed, but not if the run was
    # cancelled, so a cancelled run doesn't overwrite the last real result.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Needed so the local publish-badges action is available.
      - uses: actions/checkout@v3
      - uses: ./.github/actions/publish-badges
