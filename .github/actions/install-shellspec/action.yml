name: Install ShellSpec
description: >-
  Downloads a ShellSpec (testing framework) release and puts `shellspec` on PATH. Works on
  both Ubuntu and macOS runners.

inputs:
  version:
    description: ShellSpec release to install.
    required: false
    default: '0.28.1'

outputs:
  path:
    description: Absolute path to the installed `shellspec` executable.
    value: ${{ steps.install.outputs.path }}

runs:
  using: composite
  steps:
    - name:  Installing ShellSpec ${{ inputs.version }}...
      id:    install
      shell: sh
      env:
        VERSION:     ${{ inputs.version }}
        INSTALL_DIR: ${{ runner.tool_cache }}/shellspec/${{ inputs.version }}
      run: |
        # Skip the download if this version is already present (e.g. on a
        # self-hosted runner that keeps its tool cache between jobs).
        if [ ! -x "$INSTALL_DIR/shellspec" ]; then
          mkdir -p "$INSTALL_DIR"
          # ShellSpec's server doesn't reliably work, so retry a few times.
          curl -fsSL --retry 3 \
              "https://github.com/shellspec/shellspec/releases/download/$VERSION/shellspec-dist.tar.gz" \
            | tar -xz --strip-components=1 -C "$INSTALL_DIR"
        fi

        # Verify successful install.
        "$INSTALL_DIR/shellspec" --version

        echo "$INSTALL_DIR" >> "$GITHUB_PATH"
        echo "path=$INSTALL_DIR/shellspec" >> "$GITHUB_OUTPUT"
