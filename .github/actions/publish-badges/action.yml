name: Publish Badges
description: >-
  Stores every result recorded by `record-badge-result` in this run on a
  dedicated branch (default 'badges'), under a directory named after the
  tested branch, then recomputes all of that branch's badges in a single
  commit. A badge also reflects the results of the code it depends on, as
  listed in `.github/badge-dependencies`. Badge paths must end in
  '-<shell>.json'. It also writes one project-wide badge per shell,
  'project-<shell>.json', covering every tested file in that shell.
  Note: The calling job must check out the repo and needs
  `permissions: contents: write`.

inputs:
  badge-branch:
    description: Branch the JSON files are stored on.
    required: false
    default: 'badges'
  token:
    description: Token used to push to the badge branch.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Downloading recorded results...
      uses: actions/download-artifact@v4
      with:
        pattern:        badge-result-*
        path:           ${{ runner.temp }}/badge-results
        merge-multiple: true

    - name:  Publishing badges...
      shell: sh
      env:
        TOKEN:            ${{ inputs.token }}
        REPO:             ${{ github.repository }}
        REF_NAME:         ${{ github.ref_name }}
        BADGE_BRANCH:     ${{ inputs.badge-branch }}
        FALLBACK_BRANCH:  ${{ github.event.repository.default_branch }}
        DEPENDENCIES:     ${{ github.workspace }}/.github/badge-dependencies
      run: |
        results="$RUNNER_TEMP/badge-results"
        if ! ls "$results"/*.tsv >/dev/null 2>&1; then
          echo "No badge results were recorded, so there's nothing to publish."
          exit 0
        fi

        if [ ! -f "$DEPENDENCIES" ]; then
          echo "::warning::$DEPENDENCIES not found, so badges only cover their own code."
          DEPENDENCIES=/dev/null
        fi

        # Each result line is: badge path, label, job status, skip count.
        # Merge this run's results into one line per badge. Jobs sharing a
        # badge run the same tests on different platforms, so any failure
        # wins, a missing skip count wins over a number, and otherwise the
        # most skipped by any one job wins.
        merged="$RUNNER_TEMP/badge-merged.tsv"
        awk -F '\t' -v OFS='\t' '
          {
            label[$1] = $2
            if (!($1 in status)) {
              status[$1] = $3
              skipped[$1] = $4
              next
            }
            if ($3 != "success") {
              status[$1] = $3
            }
            if ($4 == "" || skipped[$1] == "") {
              skipped[$1] = ""
            }
            else if ($4 + 0 > skipped[$1] + 0) {
              skipped[$1] = $4
            }
          }
          END { for (badge in status) print badge, label[badge], status[badge], skipped[badge] }
        ' "$results"/*.tsv > "$merged"

        dir="$RUNNER_TEMP/badges"
        git init -q "$dir"
        cd "$dir"
        git remote add origin "https://x-access-token:$TOKEN@github.com/$REPO.git"
        git config user.name  'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

        tab=$(printf '\t')
        stored="$RUNNER_TEMP/badge-stored.tsv"
        summary="$RUNNER_TEMP/badge-summary.tsv"

        # Other workflows may push to the badge branch at the same time, so
        # retry on a rejected push, starting again from the latest commit.
        # Badges are recomputed on every attempt, so whichever workflow
        # pushes last uses everyone's latest results.
        attempt=1
        while :; do
          if git fetch -q --depth 1 origin "$BADGE_BRANCH"; then
            git checkout -q -f -B "$BADGE_BRANCH" FETCH_HEAD
          else
            # First run: the badge branch doesn't exist yet, so start it with
            # no history. If it does exist, the push below is rejected (it
            # isn't forced) and the next attempt fetches it.
            git symbolic-ref HEAD "refs/heads/$BADGE_BRANCH"
          fi

          # Store this run's results next to their badges, so later runs of
          # other workflows can use them.
          while IFS="$tab" read -r badge label status skipped; do
            file="$REF_NAME/${badge%.json}.tsv"
            mkdir -p "$(dirname "$file")"
            printf '%s\t%s\t%s\t%s\n' "$badge" "$label" "$status" "$skipped" > "$file"
            git add "$file"
          done < "$merged"

          # Gather every stored result. The default branch's come first, so
          # the tested branch's own results replace them. That fills in code
          # this branch hasn't changed, and so hasn't tested.
          : > "$stored"
          if [ "$FALLBACK_BRANCH" != "$REF_NAME" ] && [ -d "$FALLBACK_BRANCH" ]; then
            find "$FALLBACK_BRANCH" -name '*.tsv' -exec cat {} + >> "$stored"
          fi
          find "$REF_NAME" -name '*.tsv' -exec cat {} + >> "$stored"

          # The dependency file has lines like 'unit: dependency ...', where a
          # unit is a badge path without its '-<shell>.json' ending. A badge
          # covers its own unit plus all of its dependencies (followed
          # transitively) in the same shell, and takes the worst result:
          #   - Not Compatible (a test failed)
          #     >
          #   - unknown (no skip count, or no result at all)
          #     >
          #   - "N skipped" (summed across units)
          #     >
          #   - Compatible
          # It also writes a 'project-<shell>.json' badge for each shell, which
          # takes the worst result of every unit tested in that shell. Each
          # unit's own result is used once, so skips aren't double counted
          # through dependencies.
          awk -F '\t' '
            # Sets message and color for a badge from its worst rank and
            # its total skip count.
            function describe(worst, total) {
              if (worst == 3) {
                message = "Not Compatible"
                color = "red"
              } else if (worst == 2) {
                message = "unknown"
                color = "lightgrey"
              } else if (worst == 1) {
                message = total " skipped"
                color = "orange"
              } else {
                message = "Compatible"
                color = "brightgreen"
              }
            }

            FILENAME == ARGV[1] {
              line = $0
              sub(/#.*/, "", line)
              if (line !~ /:/) next
              unit = line
              sub(/:.*/, "", unit)
              gsub(/[ \t]/, "", unit)
              sub(/^[^:]*:/, "", line)
              deps[unit] = deps[unit] " " line
              next
            }
            {
              label[$1] = $2
              if ($3 != "success") {
                rank[$1] = 3
              } else if ($4 == "") {
                rank[$1] = 2
              } else if ($4 + 0 > 0) {
                rank[$1] = 1
              } else {
                rank[$1] = 0
              }
              skipped[$1] = $4 + 0
            }
            END {
              for (badge in rank) {
                if (!match(badge, /-[^\/-]+\.json$/)) continue
                unit = substr(badge, 1, RSTART - 1)
                suffix = substr(badge, RSTART)
                units[unit] = 1
                suffixes[suffix] = 1

                split("", seen)
                top = 1
                stack[1] = unit
                worst = 0
                total = 0
                while (top > 0) {
                  current = stack[top]
                  top--
                  if (current in seen) continue
                  seen[current] = 1
                  key = current suffix
                  if (key in rank) {
                    if (rank[key] > worst) worst = rank[key]
                    total += skipped[key]
                  } else if (worst < 2) {
                    worst = 2
                  }
                  count = split(deps[current], dep, /[ \t]+/)
                  for (i = 1; i <= count; i++)
                    if (dep[i] != "") stack[++top] = dep[i]
                }

                describe(worst, total)
                printf "%s\t%s\t%s\t%s\n", badge, label[badge], message, color
              }
              # Project badges: one per shell, built from each unit result
              # directly rather than from the inherited badges above.
              for (suffix in suffixes) {
                worst = 0
                total = 0
                for (unit in units) {
                  key = unit suffix
                  if (key in rank) {
                    if (rank[key] > worst) {
                      worst = rank[key]
                    }
                    total += skipped[key]
                  } else if (worst < 2) {
                    worst = 2
                  }
                }
                # "-zsh.json" becomes "zsh".
                shellName = substr(suffix, 2, length(suffix) - 6)
                describe(worst, total)
                printf "%s\t%s\t%s\t%s\n", "project" suffix, shellName, message, color
              }
            }
          ' "$DEPENDENCIES" "$stored" > "$summary"

          while IFS="$tab" read -r badge label message color; do
            file="$REF_NAME/$badge"
            mkdir -p "$(dirname "$file")"
            printf '{"schemaVersion":1,"label":"%s","message":"%s","color":"%s"}\n' \
              "$label" "$message" "$color" > "$file"
            git add "$file"
            echo "$file: $message"
          done < "$summary"

          if git diff --cached --quiet; then
            echo "Badges are unchanged."
            exit 0
          fi

          git commit -q -m "Update badges for $REF_NAME"
          if git push -q origin "HEAD:refs/heads/$BADGE_BRANCH"; then
            exit 0
          fi

          if [ "$attempt" -ge 5 ]; then
            echo "::error::Unable to push badges to $BADGE_BRANCH."
            exit 1
          fi
          attempt=$((attempt + 1))
          sleep "$attempt"
        done
